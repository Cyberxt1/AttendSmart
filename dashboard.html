<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard Redirect - Adeleke University QR Attendance System">
    <title>Adeleke University | Redirecting</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="Dashboard Redirect">
    <div class="login-page">
        <div class="login-container" style="max-width: 420px;">
            <div class="login-card">
                <div class="login-header">
                    <h2 class="login-title">Redirecting...</h2>
                    <p class="login-subtitle">Taking you to the correct dashboard for your role.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await App.ready();

            if (!Auth.isAuthenticated()) {
                window.location.href = "index.html";
                return;
            }

            window.location.href = Page.getDefaultRoute(Auth.getCurrentUser());
        });
    </script>
</body>
</html>
