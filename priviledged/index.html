<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Privileged Sign In - Adeleke University QR Attendance System">
    <title>Adeleke University | Privileged Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body data-page="Privileged Sign In">
    <div class="login-page">
        <div class="login-container" style="max-width: 420px;">
            <div class="login-branding">
                <h1 class="school-name">Adeleke University</h1>
                <p class="school-subtitle">Privileged Access Portal</p>
            </div>

            <div class="login-card">
                <div class="login-header">
                    <h2 class="login-title">Privileged Sign In</h2>
                    <p class="login-subtitle">For lecturers and administrators</p>
                </div>

                <form class="login-form" id="login-form">
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="input-group">
                            <span class="input-icon">📧</span>
                            <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-group">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-full" id="login-btn">
                        Sign In
                    </button>
                </form>

                <div class="login-footer">
                    <p class="login-footer-text">
                        Need a privileged account?
                        <a href="./register.html" class="login-footer-link">Create one</a>
                    </p>
                    <p class="login-footer-text" style="margin-top: var(--space-2);">
                        Student?
                        <a href="../index.html" class="login-footer-link">Use student sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await Page.redirectAuthenticatedUser();
        });

        document.getElementById("login-form").addEventListener("submit", async function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const loginBtn = document.getElementById("login-btn");

            UI.setButtonLoading(loginBtn, true, `Signing in to ${APP_CONFIG.SCHOOL_NAME}...`);

            try {
                const result = await Auth.login(email, password);

                if (!result.success) {
                    UI.toast(result.message, "error");
                    UI.setButtonLoading(loginBtn, false);
                    return;
                }

                if (!["lecturer", "admin"].includes(result.user.role)) {
                    UI.toast("This page is only for lecturer and admin accounts.", "error");
                    await Auth.logout();
                    return;
                }

                UI.toast(result.message, "success");
                setTimeout(() => {
                    window.location.href = Page.getDefaultRoute(result.user);
                }, 1000);
            } catch (error) {
                UI.toast("An error occurred. Please try again.", "error");
                UI.setButtonLoading(loginBtn, false);
            }
        });
    </script>
</body>
</html>
